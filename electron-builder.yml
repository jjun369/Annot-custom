appId: app.pagedock.desktop
productName: PageDock
asar: true
directories:
  output: dist
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .next/standalone
    to: app
    filter:
      - '**/*'
      - '!node_modules/**/*'
  - from: .next/standalone/node_modules
    to: app/node_modules
    filter:
      - '**/*'
  - from: .next/static
    to: app/.next/static
  - from: public
    to: app/public
  - from: build/icon.png
    to: assets/icon.png
  - from: LICENSE
    to: legal/LICENSE
  - from: NOTICE
    to: legal/NOTICE
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: PageDock-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PageDock
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: jjun369
  repo: Annot-custom
  releaseType: release
