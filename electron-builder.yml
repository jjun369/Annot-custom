appId: app.pagedock.desktop
productName: PageDock
asar: true
electronLanguages:
  - en-US
  - ko
directories:
  output: dist
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .next/standalone
    to: app
    filter:
      - '**/*'
      - '!node_modules/**/*'
  - from: .next/standalone/node_modules
    to: app/node_modules
    filter:
      - '**/*'
  # Next 16 Turbopack standalone tracing omits several route runtime files.
  # Overlay the production runtimes required by packaged API routes.
  - from: node_modules/next/dist/compiled/next-server
    to: app/node_modules/next/dist/compiled/next-server
    filter:
      - '*.runtime.prod.js'
  - from: .next/static
    to: app/.next/static
  - from: public
    to: app/public
  - from: build/icon.png
    to: assets/icon.png
  - from: LICENSE
    to: legal/LICENSE
  - from: NOTICE
    to: legal/NOTICE
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: PageDock-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PageDock
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: jjun369
  repo: PageDock-Releases
  releaseType: release
